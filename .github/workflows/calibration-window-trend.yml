name: calibration window trend branch

on:
  push:
    branches:
      - agent/calibration-window-trend-20260928
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: calibration window trend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

